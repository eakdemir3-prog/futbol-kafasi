name: Build AAB
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Keystore
        run: echo "${{ secrets.KS_B64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
      - name: Build
        env:
          KS_PATH: ${{ runner.temp }}/upload.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: upload
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((VERSION_CODE + 20))
          gradle --no-daemon :app:bundleRelease :app:assembleRelease
          V=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab out/FutbolKafasi-v$V-$VERSION_CODE.aab
          cp app/build/outputs/apk/release/app-release.apk out/FutbolKafasi-v$V-$VERSION_CODE.apk
          echo "TAG=v$V-$VERSION_CODE" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: futbol-kafasi, path: out/* }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: out/*
