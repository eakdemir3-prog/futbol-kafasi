plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def vCode = (System.getenv("VERSION_CODE") ?: "13") as int
def admobAppId = System.getenv("ADMOB_APP_ID") ?: "ca-app-pub-2435516035253344~3300682148"   // AdMob: Futbol Kafası

android {
    namespace 'com.eavisionlabs.futbolkafasi'
    compileSdk 36
    defaultConfig {
        applicationId "com.eavisionlabs.futbolkafasi"
        minSdk 24
        targetSdk 36
        versionCode vCode
        versionName "1.3.0"
        manifestPlaceholders = [admobAppId: admobAppId]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KS_PATH") ?: "upload.jks")
            storePassword System.getenv("KS_PASS")
            keyAlias System.getenv("KS_ALIAS") ?: "upload"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.android.billingclient:billing:8.2.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
